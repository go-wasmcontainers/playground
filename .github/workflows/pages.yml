name: pages

# Builds the playground (images and their /v2 mirror, the engine, the page)
# and publishes it at https://go-wasmcontainers.github.io/playground/, then
# waits until the CDN serves exactly this build's files (max-age=600).
on:
  push:
    branches: [main]
  # Daily: the pkgx images are derived from the signed catalogue at build
  # time, so a bottle published since the last push appears without one.
  # The build is deterministic; an unchanged catalogue redeploys the same files.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      # wasmtime: the build smoke-tests every pkgx image against it and marks
      # the clean ones "checked" in catalog.json.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: build the site (outside the checkout)
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/go-wasmcontainers/engine)
          go run ./cmd/site build --out "$RUNNER_TEMP/_site" --pkgx --smoke internal/mirror/testdata/smoke.json --remote --version "$version"
          ls -la "$RUNNER_TEMP/_site"
      - name: the checkout is unchanged (the wasm binaries are stamped vcs.modified=false)
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/status.txt"
          if [ -s "$RUNNER_TEMP/status.txt" ]; then cat "$RUNNER_TEMP/status.txt"; echo "::error::the build changed the checkout"; exit 1; fi
      - name: the published wasm is stamped from this commit, unmodified
        run: go run github.com/go-fleettools/buildstamp/cmd/buildstamp@v0.1.0 check --revision "$GITHUB_SHA" "$RUNNER_TEMP/_site/engine.wasm" "$RUNNER_TEMP/_site/dashboard.wasm"
      - uses: actions/upload-pages-artifact@v5
        with: { path: "${{ runner.temp }}/_site" }
      - uses: actions/upload-artifact@v7
        with: { name: build-manifest, path: "${{ runner.temp }}/_site/build.json" }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - uses: actions/download-artifact@v8
        with: { name: build-manifest, path: manifest }
      # pipefail: without it the pipeline's status is tee's, and a verify that
      # never matched reported success (it did, on the first deployment).
      - name: the live site serves this build, byte for byte
        run: |
          set -o pipefail
          go run ./cmd/site verify --url https://go-wasmcontainers.github.io/playground/ --manifest manifest/build.json --timeout 25m | tee -a "$GITHUB_STEP_SUMMARY"

  # Then use it: the e2e session typed into the deployed page, in Chromium,
  # which runs the isolating service worker as a visitor's browser does.
  live:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Playwright driver and Chromium
        run: |
          echo "PLAYWRIGHT_DRIVER_PATH=$RUNNER_TEMP/pwdriver" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"
          go run ./cmd/site playwright-driver --dir "$RUNNER_TEMP/pwdriver"
          PLAYWRIGHT_DRIVER_PATH="$RUNNER_TEMP/pwdriver" PLAYWRIGHT_NODEJS_PATH="$(command -v node)" \
            go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium
      - name: the live page, used
        env:
          E2E_URL: https://go-wasmcontainers.github.io/playground/
          E2E_PKGX: "1"
        run: go test -tags e2e -count=1 -v -run 'TestLive|TestDashboard' -timeout 15m ./e2e/ > "$RUNNER_TEMP/live.log" 2>&1 && status=0 || status=$?; tail -30 "$RUNNER_TEMP/live.log"; exit "$status"
