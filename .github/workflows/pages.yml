name: pages

# Builds the playground (images and their /v2 mirror, the engine, the page)
# and publishes it at https://go-wasmcontainers.github.io/playground/, then
# waits until the CDN serves exactly this build's files (max-age=600).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - name: build the site
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/go-wasmcontainers/engine)
          go run ./cmd/site build --out _site --pkgx --version "$version"
          ls -la _site
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - uses: actions/upload-artifact@v7
        with: { name: build-manifest, path: _site/build.json }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - uses: actions/download-artifact@v8
        with: { name: build-manifest, path: manifest }
      - name: the live site serves this build, byte for byte
        run: go run ./cmd/site verify --url https://go-wasmcontainers.github.io/playground/ --manifest manifest/build.json --timeout 25m | tee -a "$GITHUB_STEP_SUMMARY"
